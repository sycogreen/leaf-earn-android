
name: Diagnose v1.0 Release APK Signing

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/diagnose-release-signing.yml"

permissions:
  contents: read

jobs:
  inspect-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Download and verify exact release APK
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            "https://github.com/sycogreen/leaf-earn-android/releases/download/v1.0/Leaf-Earn.apk" \
            -o Leaf-Earn-v1.0.apk

          echo "507bb945265b4e1791d16cf5bf3dd1345d0656c0c2b4ead502cb839c5958572e  Leaf-Earn-v1.0.apk" | sha256sum --check

            - name: Install Android build tools
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/android-tools"
          cd "$RUNNER_TEMP/android-tools"

          curl -fL \
            "https://dl.google.com/android/repository/build-tools_r35-linux.zip" \
            -o build-tools.zip

          unzip -q build-tools.zip

          ./android-15/apksigner version

          echo "$RUNNER_TEMP/android-tools/android-15" >> "$GITHUB_PATH"
      - name: Print actual APK certificate
        run: |
          apksigner verify --print-certs Leaf-Earn-v1.0.apk
