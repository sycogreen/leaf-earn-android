
name: Diagnose v1.0 Release APK Signing

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/diagnose-release-signing.yml"

permissions:
  contents: read

jobs:
  inspect-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Download and verify exact release APK
        shell: bash
        run: |
          set -euo pipefail

          APK_URL="https://github.com/sycogreen/leaf-earn-android/releases/download/v1.0/Leaf-Earn.apk"

          echo "Downloading official v1.0 APK..."
          curl -fL --retry 3 "$APK_URL" -o Leaf-Earn-v1.0.apk

          echo "Checking APK SHA-256..."
          echo "507bb945265b4e1791d16cf5bf3dd1345d0656c0c2b4ead502cb839c5958572e  Leaf-Earn-v1.0.apk" | sha256sum --check

      - name: Locate installed Android apksigner
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          echo "Searching Android SDK: $SDK"

          APK_SIGNER="$(find "$SDK" -type f -name apksigner 2>/dev/null | head -n 1)"

          if [ -z "$APK_SIGNER" ]; then
            echo "ERROR: apksigner was not found on this runner."
            echo "Android SDK contents:"
            ls -la "$SDK" || true
            exit 1
          fi

          chmod +x "$APK_SIGNER"

          echo "APK_SIGNER=$APK_SIGNER" >> "$GITHUB_ENV"

          echo "Found apksigner successfully."

      - name: Print actual APK certificate
        shell: bash
        run: |
          set -euo pipefail

          "$APK_SIGNER" version

          echo "Verifying APK signature..."
          "$APK_SIGNER" verify --verbose Leaf-Earn-v1.0.apk

          echo "Certificate details:"
          "$APK_SIGNER" verify --print-certs Leaf-Earn-v1.0.apk
          
